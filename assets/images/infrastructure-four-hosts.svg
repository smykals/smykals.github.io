<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc"><title id="title">Four-host infrastructure lab</title><desc id="desc">Four separate physical hosts provide jump access, NAS storage, VPN access, and local AI. The jump host runs Proxmox with a Windows 11 VM. TrueNAS connects to physical disks and has two physical Ethernet connections using a bridge. The VPN host runs WireGuard and Tailscale. The AI host runs Ollama with Open WebUI. Network lines show logical relationships rather than exact physical wiring.</desc><rect width="1000" height="710" rx="16" fill="#0b1220"/><style>text{font-family:Arial,sans-serif;fill:#eef4fa;text-anchor:middle}.title{font-size:22px;font-weight:bold}.label{font-size:17px;font-weight:bold}.sub{font-size:15px;fill:#b0bfd0}.host{fill:#101b2b;stroke:#385578;stroke-width:2}.layer{fill:#17263b;stroke:#445e7c}.wire{fill:none;stroke:#e34f57;stroke-width:3}</style><text x="500" y="38" class="sub">CURRENT LAB / FOUR SEPARATE PHYSICAL HOSTS</text><rect class="host" x="300" y="65" width="400" height="65" rx="12"/><text class="title" x="500" y="105">Lab network</text><path class="wire" d="M500 130 V155 H250 V190 M500 155 H750 V190 M250 155 H65 V435 H250 V465 M750 155 H935 V435 H750 V465"/><rect class="host" x="55" y="190" width="390" height="195" rx="14"/><text class="sub" x="250" y="216">DEDICATED PHYSICAL HARDWARE</text><text class="title" x="250" y="248">Jump server</text><text class="sub" x="250" y="284">Proxmox VE</text><text class="sub" x="250" y="312">Windows 11 virtual machine</text><text class="sub" x="250" y="340">Administrative / jump access</text><rect class="host" x="555" y="190" width="390" height="195" rx="14"/><text class="sub" x="750" y="216">DEDICATED PHYSICAL HARDWARE</text><text class="title" x="750" y="248">NAS / storage</text><text class="sub" x="750" y="284">TrueNAS connected to physical disks</text><text class="sub" x="750" y="312">Two physical Ethernet connections</text><text class="sub" x="750" y="340">Bridge configuration</text><rect class="host" x="55" y="465" width="390" height="195" rx="14"/><text class="sub" x="250" y="491">DEDICATED PHYSICAL HARDWARE</text><text class="title" x="250" y="523">VPN / remote access</text><text class="sub" x="250" y="559">WireGuard</text><text class="sub" x="250" y="587">Tailscale</text><text class="sub" x="250" y="615">Dedicated remote-access host</text><rect class="host" x="555" y="465" width="390" height="195" rx="14"/><text class="sub" x="750" y="491">DEDICATED PHYSICAL HARDWARE</text><text class="title" x="750" y="523">Local AI</text><text class="sub" x="750" y="559">Ollama</text><text class="sub" x="750" y="587">Open WebUI</text><text class="sub" x="750" y="615">Dedicated AI host</text><text class="sub" x="500" y="695">Logical connectivity only; exact cabling, interfaces, and addresses are omitted.</text></svg>