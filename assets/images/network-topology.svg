<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc"><title id="title">Network lab logical topology</title><desc id="desc">Internet connects to FortiGate routing and firewalling, then over an 802.1Q trunk to Cisco switching. Management, server, and client segments branch from switching. The server segment connects to service endpoints.</desc><rect width="960" height="660" rx="18" fill="#0b1220"/><style>text{font-family:Arial,sans-serif;text-anchor:middle;fill:#e2e8f0}.label{font-size:19px;font-weight:700}.sub{font-size:14px;fill:#a8b6c8}.link{stroke:#647d99;stroke-width:3;fill:none}rect.node{fill:#101f32;stroke:#28537b;stroke-width:2}</style><text x="480" y="38" class="sub">INDEPENDENT LAB / LOGICAL ARCHITECTURE</text><path class="link" d="M480 104 V135 M480 217 V278 M480 360 V403 H170 V433 M480 403 V433 M480 403 H790 V433 M480 515 V547 H365 V577 M480 547 H595 V577"/><text x="585" y="253" class="sub">802.1Q trunk</text><rect class="node" x="365" y="50" width="230" height="68" rx="12"/><text class="label" x="480.0" y="81">Internet</text><text class="sub" x="480.0" y="106">Upstream connectivity</text><rect class="node" x="340" y="135" width="280" height="82" rx="12"/><text class="label" x="480.0" y="166">FortiGate 60E</text><text class="sub" x="480.0" y="191">Routing &amp; firewalling</text><rect class="node" x="320" y="278" width="320" height="82" rx="12"/><text class="label" x="480.0" y="309">Cisco Catalyst switching</text><text class="sub" x="480.0" y="334">3560 / 2960</text><rect class="node" x="45" y="433" width="250" height="82" rx="12"/><text class="label" x="170.0" y="464">Management</text><text class="sub" x="170.0" y="489">Device administration / SSH</text><rect class="node" x="355" y="433" width="250" height="82" rx="12"/><text class="label" x="480.0" y="464">Servers</text><text class="sub" x="480.0" y="489">Service endpoints</text><rect class="node" x="665" y="433" width="250" height="82" rx="12"/><text class="label" x="790.0" y="464">Clients</text><text class="sub" x="790.0" y="489">Test systems / endpoints</text><rect class="node" x="260" y="577" width="210" height="68" rx="12"/><text class="label" x="365.0" y="608">Service endpoint</text><text class="sub" x="365.0" y="633">Server segment</text><rect class="node" x="490" y="577" width="210" height="68" rx="12"/><text class="label" x="595.0" y="608">Service endpoint</text><text class="sub" x="595.0" y="633">Server segment</text></svg>